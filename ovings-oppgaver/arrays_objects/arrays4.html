<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arrays oppgave 4</title>
</head>
<body>
    <ul id="events">

    </ul>
    <script>
        const years = [1066, 1564, 1455, 1346, 1215]

        years.sort(function(a, b) { return a - b })

        let eventHTML = ""
        years.map(year => {eventHTML += "<li>" + year + "</li>"})
        document.getElementById("events").innerHTML = eventHTML

    </script>
</body>
</html>
