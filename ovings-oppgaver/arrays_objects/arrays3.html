<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays oppgave 3</title>
</head>
<body>
    <p id="antall">Antall dyr: <span id="antallDyr"></span></p>
    <script>
        const dyr = ["Lion", "Cat", "Jaguar", "Puma", "Bear", "Dog", "Eagle", "Cow", "Worm", "Dolphin"]

        dyr.push("Horse", "Monkey")

        dyr.sort()

        const antallDyr = dyr.length

        document.getElementById("antallDyr").innerHTML = antallDyr + " = " + dyr.join(", ")
    </script>
</body>
</html>
