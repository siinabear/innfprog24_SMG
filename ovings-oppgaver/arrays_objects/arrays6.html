<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arrays oppgave 6</title>
</head>
<body>
    <h1>iOS Games</h1>
    <ul id="filter"></ul>

    <script>
        const games = [
        {title: "Angry Birds", platforms: ["iOS", "Android"]},
        {title: "Nongram", platforms: ["Android"]},
        {title: "Plants vs Zombies", platforms: ["iOS", "Android", "Windows", "MacOS"]},
        {title: "Pinball", platforms: ["Windows", "Android"]},
        {title: "Planet Zoo", platforms: ["Windows", "MacOS"]},
        {title: "Wordle", platforms: ["iOS", "MacOS"]}
    ]

    const iosGames = games.filter(pf => pf.platforms.includes("iOS"))

    let iosGamesPrint = ""
    iosGames.map(ig => {iosGamesPrint += "<li>" + ig.title + "</li>"})
    document.getElementById("filter").innerHTML = iosGamesPrint


    </script>
</body>
</html>
