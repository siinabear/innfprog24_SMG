<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop 1: Passordgenerator</title>
</head>
<body>
    <main>
        <h2>Passordgenerator</h2>
        <p>
            <label for="length">Hvor langt skal passordet være?</label>
            <input type="number" id="amount" name="amount" value="8"/>
        </p>
        <button id="generer">Generer passord</button>
        <p id="passordutskrift"></p>

    </main>

    <script>
        let passord = ""
        
        const lowerCase = "abcdefghijklmnopqrstuvwxyzæøå"
        const upperCase = "ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ"
        const numbers = "0123456789"
        const specialChars = "*!@#$%^&()_+-=~`"

        const tillateTegn = ""

        document.getElementById("generer").addEventListener("click", function(event){
            passord = ""
            const passwordLength = document.getElementById("amount").value
            for (teller = 0; teller < passwordLength; teller++) {
                const tilfeldigTegn = Math.floor(Math.random() * tillateTegn.length)
                passord += tillateTegn[tilfeldigTegn]
            }
              document.getElementById("passordutskrift").innerHTML = passord

        })
    </script>
</body>
</html>
