<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Oppgave 2</title>
    </head>
    <body>
        <p>Hei, <span id="utskriftSpan"></span></p>

        <script>
            const age = 23
            let tekst = ""

            if (age < 18 ) {
                tekst = "Du er ikke myndig"
            } else if (age <= 62) {
                tekst = "Du er klar for arbeidslivet"
            } else if (age > 62) {
                tekst = "Du er gammel som fan"
            }

            document.getElementById("utskriftSpan").innerHTML = tekst
        </script>
    </body>
</html>
