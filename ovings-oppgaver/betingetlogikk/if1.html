<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Oppgave 1</title>
    </head>
    <body>
        <p>Hei, <span id="utskriftSpan"></span></p>

        <script>
            const name = "Siina"
            let utskrift = ""
            
            if (name === "Siina") {
                utskrift = "Mitt navn er Siina"
            } else {
                utskrift = "Mitt navn er ikke Siina"
            }

            document.getElementById("utskriftSpan").innerHTML = utskrift

        </script>
    </body>
</html>
