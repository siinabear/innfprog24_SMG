<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat Sheet: Brukerinput for Tastatur</title>
</head>
<body>
    <p>Retning: <span id="direction"></span></p>

    <ul id="tastetrykk">
        
    </ul>
    <ul id="tasteslipp">

    </ul>

    <script>
        //et even som sjekker etter når vi trykker ned en tast
        document.addEventListener("keydown", function (event){
            document.getElementById("tastetrykk").innerHTML += `<li>Tasten ${event.key} med kode ${event.code} er trykket ned</li>`
        })

        //et event som sjekker etter når vi slipper opp en tast
        document.addEventListener("keyup", function (event){
            document.getElementById("tasteslipp").innerHTML += `<li>Tasten ${event.key} med kode ${event.code} er sluppet opp</li>`
        })

        //sjekke om piltaster er trykket ned, og bestemme retning:
        let direction = ""

        document.addEventListener("keydown", function (event){
            if(event.key === "a") {
                direction = "left"
            }
            if (event.key === "d") {
                direction = "right"
            }
            if (event.key === "s") {
                direction = "down"
            }
            if (event.key === "w") {
                direction = "up"
            }
            document.getElementById("direction").innerHTML = direction
        })

        document.addEventListener("keyup", function (event){
            if(event.key === "a" || event.key === "w" || event.key === "s" || event.key === "d") {
                direction = ""
            }
            document.getElementById("direction").innerHTML = direction
        })
    </script>
</body>
</html>
