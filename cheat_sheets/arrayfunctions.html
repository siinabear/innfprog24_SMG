<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat Sheet for Arrayfunksjoner</title>
</head>
<body>
    <h1>Arrayfunksjoner</h1>
    <p>Vi finner antall i en array ved å bruke .length: <span id="arrayCount"></span></p>

    <h2>To måter å skrive ut en Array på</h2>
    <p>.toString(): <span id="toString"></span></p>
    <p>.join(): <span id="join"></span></p>

    <h2>Array etter slettemetoder er kjørt</h2>
    <p id="deleted"></p>

    <h2>Sortering</h2>
    <p>Sortert A-Å: <span id="sortAZ"></span></p>
    <p>Sortert Å-A: <span id="sortZA"></span></p>
    
    <h2>Sortering av tall</h2>
    <p>Sortert 0-9: <span id="sort09"></span></p>
    <p>Sortert 9-0: <span id="sort90"></span></p>

    <script>
        const books = [
            "Silver Eyes",
            "Harry Potter og de visens sten",
            "Fourth Wing",
            "Bibelen",
            "Nålen",
            "Jævla drittsystem",
            "Don't make me think",
            "Twisted Ones",
            "Hunger Games",
            "Surrounded by idiots"
        ]

        document.getElementById("arrayCount").innerHTML = books.length

        //LEGGE TIL ELEMENTER I ARRAYEN:
        //.push(element): legger inn element på slutten av arrayen
        books.push("Lord of the Rings: Fellowship of the Ring")

        //.unshift(element): legger inn element i starten av arrayenn, og forskyver indexer!
        books.unshift("Lord of the Rings: Two Towers")

        //.splice(startindex, number of elements modified, element(s)): 
        //startindex: hvilken index vi starter å manipulere arrayen på
        //number of elements modified: hvis vi skal slette elementer, hvor mange fra og med startindex (eksempel: hvis startindex er 2, og antall elementer er 2 slettes index 2 og 3). 
        //når vi legger til elementer, skal number of elements modified alltid være 0
        books.splice(5, 0, "Lord of the Rings: Return of the King")
        

        //.toString(): SKRIVER UT EN KOMMASEPARERT LISTE AV EN ARRAY
        document.getElementById("toString").innerHTML = books.toString()
        //.join(param): JOIN SKRIVER UT ALLE ELEMENTENE I EN ARRAY, SEPARERT AV PARAM
        document.getElementById("join").innerHTML = books.join(", ")


        //FJERNE ELEMENTER I ARRAYEN:
        //.pop(): sletter det siste elementer i arrayen
        books.pop()

        //.shift(): sletter det første elementet i arrayen
        books.shift()

        //.splice(startindex, number of elements to delete)
        // books.splice(4, 1)

        
        //.indexOf(param): finner det første elementet i arrayen som matcher parameteren element, og returnerer indexen.
        const indexFound = books.indexOf("Lord of the Rings: Return of the King")
        console.log("Index til LOTR-bok: ", indexFound)
        //Bruke indexOf-verdien i variabelen indexFoud til å slette riktig bok:
        books.splice(indexFound, 1)
        //hvis elementet vi forsøker å finne indexen til ikke finnes, returner indexOf -1

        //hvordan sjekke om en verdi finnes i en array:
        const bookExists = books.includes("Fourth Wing")
        console.log("Finnes Fourth Wing? ", bookExists)
    
        document.getElementById("deleted").innerHTML = books.join(", ")


        //SORTERE EN ARRAY FRA A TIL Å:
        books.sort()
        document.getElementById("sortAZ").innerHTML = books.join(", ")

        //SORTERE EN ARRAY FRA Å TIL A:
        books.reverse()
        document.getElementById("sortZA").innerHTML = books.join(", ")


        //SORTERE EN ARRAY MED TALL:
        const tall = [
            1, 24, 156, 721, 912, 32, 104, 8, 24, 67, 69, 420, 23, 666
        ]

        tall.sort(function(a, b) { return a - b })
        document.getElementById("sort09").innerHTML = tall.join(", ")

        tall.sort(function(a, b) { return b - a })
        document.getElementById("sort90").innerHTML = tall.join(", ")

    </script>
</body>
</html>
